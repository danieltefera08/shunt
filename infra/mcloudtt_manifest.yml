apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: shunt
  name: shunt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shunt
  strategy: {}
  template:
    metadata:
      labels:
        app: shunt
    spec:
      containers:
      - image: gcr.io/azubi-knowhow-building/shunt
        name: shunt
        imagePullPolicy: Always
        resources: {}
        ports:
          - containerPort: 1883
      - image: redis:latest
        name: redis
        imagePullPolicy: Always
        resources: {}
status: {}

---

apiVersion: v1
kind: Service
metadata:
  name: shunt
  labels:
    run: shunt
spec:
  ports:
  - port: 1883
    protocol: TCP
  selector:
    app: shunt
  type: LoadBalancer