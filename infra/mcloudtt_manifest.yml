apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: shunt
  name: shunt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shunt
  strategy: {}
  template:
    metadata:
      labels:
        app: shunt
    spec:
      containers:
      - image: shunt:latest
        name: shunt
        imagePullPolicy: Never
        resources: {}
        ports:
          - containerPort: 1883
status: {}

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:latest
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
        ports:
        - containerPort: 6379

---

apiVersion: v1
kind: Service
metadata:
  name: shunt
  labels:
    run: shunt
spec:
  ports:
  - name: mqtt
    port: 1883
    protocol: TCP
  selector:
    app: shunt
  type: LoadBalancer

---

apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    run: redis
spec:
  ports:
  - name: redis
    port: 6379
    protocol: TCP
  selector:
    app: redis
  type: LoadBalancer